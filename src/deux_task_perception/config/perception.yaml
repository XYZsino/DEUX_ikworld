detection_node:
  ros__parameters:
    # Required: explicit trusted local YOLO checkpoint. No automatic download/install.
    weights: ""
    device: cpu
    confidence: 0.25
    target_classes: [s1, s1_1]
    max_age_s: 1.0
icp_node:
  ros__parameters:
    # Required: OBJ in metres; model_id includes its content hash and origin policy.
    model_path: ""
    model_origin: ""  # mesh or bounds_center; select to match downstream geometry.
    # Required: calibrated support-plane frame, Z up; never assume base Z is plane Z.
    reference_frame: ""
    base_frame: base_link
    min_height_m: 0.01
    max_distance_m: 1.5
    max_rmse_m: 0.015
    min_coverage: 0.5
    # Optional coarse subsampling; 0 preserves the existing full-cloud search.
    icp_initial_angles: 24
    icp_yaw_span_deg: 360.0
    icp_coarse_point_limit: 0
    # Optional separate coarse voxel cloud from raw ROI (e.g. 0.006).
    # Mutually exclusive with icp_coarse_point_limit; fine remains 3mm.
    icp_coarse_voxel_size_m: 0.0
    track_gate_m: 0.08
    track_max_age_s: 0.6
    # Configured assumptions, not statistical uncertainty estimated by ICP.
    position_std_m: 0.02
    yaw_std_rad: 0.2
    unobserved_std_rad: 3.141592653589793
    max_age_s: 1.0
